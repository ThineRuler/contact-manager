<!doctype html>
<html lang="en">
    <head>

        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
        <link href="css/styles.css" rel="stylesheet">

        <link rel="preconnect" href="https://gstatic.com">
        <link href="https://googleapis.com" rel="stylesheet">

    </head>
    <body>
        <div class="landing-shell">
            <div class="landing-content content">
                <p class="pixel-text">Knight Signal</p>
                <img src="images/nitro1.png" class="glow" alt="UCF Logo" width="150" height="150">
                <button type="button" id="openLoginPanelButton" class="login pixel-text">login</button>
                <button type="button" class="register-button pixel-text" data-toggle="modal" data-target="#registerModal">register</button>
            </div>

            <aside class="home-login-panel" aria-label="Login panel">
                <div class="content login-box">
                    <button type="button" class="back-to-home" id="closeLoginPanelButton" aria-label="Close login panel">back</button>
                    <p>Knight Signal</p>
                    <div class="login-form">
                        <form id="loginForm" novalidate>
                            <label for="login">Username:</label>
                            <input type="text" id="login" name="Login" required>
                            <label for="password">Password:</label>
                            <input type="password" id="password" name="Password" required>
                            <div id="loginMessage" class="mt-2" role="alert"></div>
                            <button type="submit" class="login">sign in</button>
                        </form>
                    </div>
                </div>
            </aside>
        </div>
        <footer class="footer pixel-text">
            <p>POOSD-Group 15 2026</p>
        </footer>
        <!-- Register Modal -->
        <div class="modal fade pixel-text" id="registerModal" tabindex="-1" role="dialog" aria-labelledby="registerModalLabel" aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="registerModalLabel">Knight Signal</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form id="registerForm">
                            <div class="form-group">
                                <label for="registerFirstName">First Name</label>
                                <input type="text" class="form-control" id="registerFirstName" name="FirstName" required>
                            </div>
                            <div class="form-group">
                                <label for="registerLastName">Last Name</label>
                                <input type="text" class="form-control" id="registerLastName" name="LastName" required>
                            </div>
                            <div class="form-group">
                                <label for="registerLogin">Username</label>
                                <input type="text" class="form-control" id="registerLogin" name="Login" required>
                            </div>
                            <div class="form-group">
                                <label for="registerPassword">Password</label>
                                <input type="password" class="form-control" id="registerPassword" name="Password" required>
                            </div>
                            <div id="registerMessage" class="mt-2" role="alert"></div>
                            <button type="submit" class="btn btn-primary mt-3">Sign Up</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
        <script src="js/code.js"></script>
    </body>
</html>
