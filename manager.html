<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="css/styles.css" rel="stylesheet">
    </head>
    <body class="manager-page">
        <img id="logoButton" class="logo" src="images/nitro1.png" alt="Return to home" width="200" height="200">
        <h1 class="manager-title">Welcome Back</h1>
        <button id="logoutButton" class="logout-button">Log Out</button>

        <div class="contact-manager-layout">
            <p style="margin-left: 20px;">Easily manage your contacts</p>
            <div class="header">
                <input id="contactSearch" type="text" placeholder="Search contacts..." aria-label="Search contacts">
            </div>
            <div class="contact-display">
                <div id="managerStatus" class="manager-status">Contacts</div>
                <div id="contactsList" class="contact-list"></div>
            </div>
            <div class="contact-counter">
                <span id="contactCount">0</span> Contact(s) Total
            </div>
            <div class="bottom-options">
                <button id="editContactsButton" class="custom-button">Edit Contacts</button>
                <button id="deleteContactsButton" class="custom-button">Delete Contacts</button>
                <button id="cancelDeleteButton" class="custom-button" hidden>Cancel Delete</button>
                <button id="addContactButton" class="custom-button">Add Contacts</button>
            </div>
        </div>

        <script src="js/code.js"></script>
    </body>
</html>
