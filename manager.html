<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="css/styles.css" rel="stylesheet">
    </head>
    <body>
        <img class="logo" src="images/nitro1.png" alt="UCF Logo" width="200" height="200">
        <div class="contact-manager-layout">
            <div class="header">
                <p> plus sign to add contact and search bar here</p>
            </div>
            <div class="contact-display">
                <div id="managerStatus" class="manager-status"></div>
                <div id="contactsList" class="contact-list"></div>
            </div>
            <div class="bottom-options">
                <button class="custom-button">edit contacts</button>
                <button id="deleteContactsButton" class="custom-button">delete contacts</button>
                <button class="custom-button">add contacts</button>
            </div>
        </div>

        <script src="js/code.js"></script>
    </body>
</html>
